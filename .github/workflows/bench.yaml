name: Benchmark
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: curioswitch/go-build/.github/actions/setup-go@432d6c326402347b1f6ec5875fbdda8d0cedc54d # v0.10.0

      # Needed for the cgo benchmark mode run by bench-all / wafbench-all.
      # The action caches the cargo registry and target directory itself.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          build-warnings: warn
          cache-workspaces: buildtools/aho-corasick

      - name: setup aho-corasick for cgo
        # cgo links the shared library. Go 1.27 rejects static archives with LLVM
        # bitcode in a -L directory, so delete them, including any restored from
        # the cargo cache.
        run: |-
          cargo build --release
          find target -name '*.a' -delete
        working-directory: buildtools/aho-corasick

      - run: go run ./build bench-all
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/buildtools/aho-corasick/target/release

      - run: go run ./build wafbench-all
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/buildtools/aho-corasick/target/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: out/*bench*.txt
